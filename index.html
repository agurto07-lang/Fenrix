<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fénrix · Reporte de Asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment: #ecd9b6;
    --parchment-dark: #d8bd8c;
    --ink: #3a2416;
    --crimson: #7a1220;
    --crimson-dark: #4a0b13;
    --crimson-bright: #a3182a;
    --gold: #c9a13b;
    --gold-light: #e8c874;
    --fire: #ff5a2a;
    --input-bg: #f7edd3;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }

  body{
    font-family: 'EB Garamond', serif;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,90,42,0.10), transparent 45%),
      radial-gradient(ellipse at 80% 100%, rgba(255,90,42,0.10), transparent 50%),
      radial-gradient(ellipse at 50% 50%, #2a0c10 0%, #170608 60%, #0c0304 100%);
    min-height: 100vh;
    color: var(--parchment);
    position: relative;
    overflow-x: hidden;
    padding: 24px 12px;
  }
  @media (min-width: 640px){
    body{ padding: 40px 16px; }
  }

  .font-display{ font-family: 'Cinzel Decorative', serif; }
  .font-heading{ font-family: 'Cinzel', serif; }

  /* Ember particles */
  .ember{
    position: fixed;
    bottom: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffd58a 0%, #ff7a2e 45%, transparent 75%);
    opacity: 0.75;
    pointer-events: none;
    animation: rise linear infinite;
    z-index: 0;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0) scale(1); opacity: 0.85;}
    100%{ transform: translateY(-110vh) translateX(var(--drift,20px)) scale(0.3); opacity: 0;}
  }

  .phoenix-glow{
    filter: drop-shadow(0 0 18px rgba(255,120,40,0.55)) drop-shadow(0 0 40px rgba(163,24,42,0.45));
  }

  /* ---------- Layout general ---------- */
  .page{
    position: relative;
    z-index: 10;
    max-width: 1152px;
    margin: 0 auto;
  }

  /* ---------- Parchment panel ---------- */
  .parchment-panel{
    background:
      repeating-linear-gradient(0deg, rgba(120,80,30,0.05) 0px, rgba(120,80,30,0.05) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 15% 10%, rgba(255,255,255,0.25), transparent 40%),
      radial-gradient(ellipse at 85% 90%, rgba(120,70,20,0.18), transparent 45%),
      linear-gradient(135deg, #f2e2bd 0%, #e8d09f 40%, #ecd9b6 60%, #dcc290 100%);
    color: var(--ink);
    border: 2px solid var(--gold);
    border-radius: 16px;
    box-shadow:
      0 0 0 6px rgba(74,11,19,0.55),
      0 0 0 8px var(--gold),
      0 25px 60px -15px rgba(0,0,0,0.7),
      inset 0 0 60px rgba(120,70,20,0.15);
    position: relative;
  }
  .parchment-panel::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 8% 92%, rgba(90,50,10,0.12) 0, transparent 12%),
      radial-gradient(circle at 95% 5%, rgba(90,50,10,0.10) 0, transparent 14%),
      radial-gradient(circle at 50% 100%, rgba(90,50,10,0.08) 0, transparent 20%);
    pointer-events:none;
  }

  .divider-flame{
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold) 15%, var(--fire) 50%, var(--gold) 85%, transparent);
    border-radius: 999px;
    margin: 16px auto;
  }

  /* ---------- Header ---------- */
  .header-banner{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,90,42,0.18), transparent 60%),
      linear-gradient(180deg, #2c0a0f 0%, #1c0609 100%);
    border-bottom: 3px solid var(--gold);
    border-radius: 16px;
    padding: 24px 16px;
    margin-bottom: 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  @media (min-width: 768px){
    .header-banner{ padding: 40px 48px; margin-bottom: 32px; }
  }
  .header-icon{ width: 44px; height: 44px; margin: 0 auto 12px; display: block; }
  @media (min-width: 768px){ .header-icon{ width: 52px; height: 52px; } }

  .header-brand{
    letter-spacing: 0.35em;
    color: var(--gold-light);
    font-size: 12px;
    margin-bottom: 8px;
  }
  @media (min-width: 768px){ .header-brand{ font-size: 14px; } }

  .header-title{
    color: var(--gold-light);
    font-size: 28px;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  }
  @media (min-width: 768px){ .header-title{ font-size: 44px; } }

  .header-divider{ width: 160px; }
  @media (min-width: 768px){ .header-divider{ width: 256px; } }

  .header-tagline{
    color: var(--parchment);
    font-size: 12px;
    letter-spacing: 0.05em;
    opacity: 0.9;
  }
  @media (min-width: 768px){ .header-tagline{ font-size: 16px; } }

  /* ---------- Stats ---------- */
  .stats-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  @media (min-width: 640px){ .stats-grid{ gap: 16px; } }
  @media (min-width: 768px){ .stats-grid{ grid-template-columns: repeat(4, 1fr); margin-bottom: 32px; } }

  .stat-card{
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .stat-icon{ font-size: 20px; margin-bottom: 4px; }
  .stat-value{ font-size: 24px; color: var(--crimson-dark); }
  @media (min-width: 768px){ .stat-value{ font-size: 30px; } }
  .stat-label{
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-top: 4px;
  }
  @media (min-width: 768px){ .stat-label{ font-size: 12px; } }

  /* ---------- Panel principal ---------- */
  .panel{ padding: 14px; }
  @media (min-width: 640px){ .panel{ padding: 20px; } }
  @media (min-width: 768px){ .panel{ padding: 32px; } }

  .panel-title-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  @media (min-width: 640px){ .panel-title-row{ gap: 12px; } }
  @media (min-width: 768px){ .panel-title-row{ margin-bottom: 24px; } }

  .panel-flame{ font-size: 20px; }
  @media (min-width: 640px){ .panel-flame{ font-size: 24px; } }
  @media (min-width: 768px){ .panel-flame{ font-size: 30px; } }

  .panel-title{ font-size: 20px; text-align: center; }
  @media (min-width: 640px){ .panel-title{ font-size: 24px; } }
  @media (min-width: 768px){ .panel-title{ font-size: 30px; } }

  /* ---------- Controles ---------- */
  .controls{
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  @media (min-width: 640px){ .controls{ gap: 12px; } }
  @media (min-width: 768px){ .controls{ flex-direction: row; gap: 16px; margin-bottom: 24px; } }

  .search-wrap{ position: relative; flex: 1; }
  .search-icon{
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--crimson);
  }
  .search-input{
    width: 100%;
    padding: 10px 16px 10px 40px;
    border-radius: 8px;
    border: 2px solid var(--gold);
    background: var(--input-bg);
    color: var(--ink);
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
  }
  @media (min-width: 640px){ .search-input{ font-size: 16px; } }
  .search-input::placeholder{ color: rgba(58,36,22,0.5); font-style: italic; }

  .filter-wrap{ position: relative; }
  @media (min-width: 768px){ .filter-wrap{ width: 256px; } }
  .filter-select{
    width: 100%;
    padding: 10px 32px 10px 16px;
    border-radius: 8px;
    border: 2px solid var(--gold);
    background: var(--input-bg);
    color: var(--ink);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    appearance: none;
    cursor: pointer;
  }
  @media (min-width: 640px){ .filter-select{ font-size: 14px; } }
  .filter-arrow{
    position: absolute; right: 12px; top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    color: var(--crimson);
  }

  select:focus, input:focus{
    outline: none;
    box-shadow: 0 0 0 3px rgba(163,24,42,0.35);
  }

  /* ---------- Tabla (escritorio) ---------- */
  .table-wrap{
    display: none;
    overflow-x: auto;
    border-radius: 12px;
    border: 2px solid var(--gold);
  }
  @media (min-width: 768px){ .table-wrap{ display: block; } }
  .table-wrap::-webkit-scrollbar{ width:10px; height:10px; }
  .table-wrap::-webkit-scrollbar-track{ background: rgba(58,36,22,0.08); border-radius: 10px;}
  .table-wrap::-webkit-scrollbar-thumb{ background: linear-gradient(180deg,var(--gold),var(--crimson)); border-radius: 10px;}

  .att-table{ width: 100%; font-size: 14px; border-collapse: collapse; }
  @media (min-width: 768px){ .att-table{ font-size: 16px; } }

  .att-table thead tr{
    background: linear-gradient(90deg, #7a1220, #4a0b13);
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
  }
  .att-table th{ text-align: left; padding: 12px 16px; white-space: nowrap; }
  .att-table th.col-center{ text-align: center; }

  .att-table td{ padding: 12px 16px; }
  .att-table tbody tr{ border-top: 1px solid rgba(201,161,59,0.3); transition: background-color .15s ease; }
  .att-table tbody tr:hover{ background: rgba(163,24,42,0.06); }

  .col-index{ font-family: 'Cinzel', serif; font-size: 12px; opacity: 0.6; }
  .col-name{ font-weight: 600; }
  .col-attend{ text-align: center; }
  .events-cell{ display: flex; flex-wrap: wrap; gap: 6px; }

  /* ---------- Tarjetas (móvil) ---------- */
  .card-list{ display: flex; flex-direction: column; gap: 10px; }
  @media (min-width: 768px){ .card-list{ display: none; } }

  .p-card{
    border-radius: 12px;
    border: 2px solid var(--gold);
    background: var(--input-bg);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .p-card-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .p-card-name-wrap{
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .p-card-index{ font-family: 'Cinzel', serif; font-size: 11px; opacity: 0.5; flex-shrink: 0; }
  .p-card-name{
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .p-card-badges{ display: flex; flex-wrap: wrap; gap: 6px; }

  /* ---------- Badges de eventos ---------- */
  .badge-event{
    background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson-dark) 100%);
    color: var(--gold-light);
    border: 1px solid var(--gold);
    font-family: 'Cinzel', serif;
    letter-spacing: 0.02em;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  @media (min-width: 768px){ .badge-event{ font-size: 12px; } }
  .badge-event.small{ font-size: 10px; padding: 2px 8px; }

  .badge-none{
    background: rgba(58,36,22,0.08);
    color: rgba(58,36,22,0.55);
    border: 1px dashed rgba(58,36,22,0.35);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    font-style: italic;
  }
  @media (min-width: 768px){ .badge-none{ font-size: 12px; } }
  .badge-none.small{ font-size: 10px; padding: 2px 8px; }

  /* ---------- Pill de asistencias ---------- */
  .attend-pill{
    font-family: 'Cinzel', serif;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    width: 36px;
    height: 36px;
  }
  .attend-pill.small{ width: 32px; height: 32px; font-size: 14px; flex-shrink: 0; }
  .attend-3{ background: linear-gradient(135deg,#7a1220,#a3182a); color:#f4e2b8; box-shadow: 0 0 12px rgba(163,24,42,0.6);}
  .attend-2{ background: linear-gradient(135deg,#9c5b1f,#c9a13b); color:#3a2416;}
  .attend-1{ background: linear-gradient(135deg,#d8bd8c,#ecd9b6); color:#3a2416;}
  .attend-0{ background: rgba(58,36,22,0.08); color:rgba(58,36,22,0.5); border:1px dashed rgba(58,36,22,0.3);}

  /* ---------- Estado vacío ---------- */
  .empty-state{
    display: none;
    text-align: center;
    padding: 40px 0;
    opacity: 0.7;
    font-family: 'Cinzel', serif;
  }
  .empty-state.visible{ display: block; }

  /* ---------- Paginación ---------- */
  .pagination-bar{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
  }
  @media (min-width: 640px){ .pagination-bar{ flex-direction: row; gap: 16px; } }
  @media (min-width: 768px){ .pagination-bar{ margin-top: 24px; } }

  .results-info{ font-size: 12px; font-family: 'Cinzel', serif; opacity: 0.8; text-align: center; }
  @media (min-width: 640px){ .results-info{ font-size: 14px; } }

  .pagination{ display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center; }
  @media (min-width: 640px){ .pagination{ gap: 6px; } }

  .page-btn{
    font-family: 'Cinzel', serif;
    transition: all .15s ease;
    padding: 6px 10px;
    border-radius: 8px;
    border: 2px solid var(--gold);
    background: var(--input-bg);
    color: var(--ink);
    font-size: 12px;
    cursor: pointer;
  }
  @media (min-width: 640px){ .page-btn{ padding: 6px 14px; font-size: 14px; } }
  .page-btn:hover:not(:disabled){ transform: translateY(-1px); box-shadow: 0 4px 10px rgba(122,18,32,0.35); }
  .page-btn:disabled{ opacity: 0.35; cursor: not-allowed; }
  .page-btn.active{
    background: linear-gradient(135deg, var(--crimson), var(--crimson-dark));
    color: var(--gold-light);
    border-color: var(--gold);
  }
  .page-ellipsis{ padding: 0 6px; font-family: 'Cinzel', serif; opacity: 0.6; font-size: 12px; }
  @media (min-width: 640px){ .page-ellipsis{ font-size: 14px; } }

  /* ---------- Footer ---------- */
  .footer{ text-align: center; margin-top: 32px; margin-bottom: 16px; }
  @media (min-width: 768px){ .footer{ margin-top: 40px; } }
  .footer-divider{ width: 128px; }
  @media (min-width: 640px){ .footer-divider{ width: 160px; } }
  @media (min-width: 768px){ .footer-divider{ width: 256px; } }
  .footer-text{ font-size: 16px; color: var(--gold-light); padding: 0 8px; }
  @media (min-width: 640px){ .footer-text{ font-size: 18px; } }
  @media (min-width: 768px){ .footer-text{ font-size: 20px; } }
  .footer-heart{ margin-top: 4px; color: var(--fire); }
</style>
</head>

  <!-- Header -->

    <svg class="header-icon phoenix-glow" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

          <stop offset="1" stop-color="#7a1220"/>
        </linearGradient>
      </defs>
    </svg>
    <p class="header-brand font-heading">FÉNRIX</p>
    <h1 class="header-title font-display">Reporte de Asistencia</h1>

    <p class="header-tagline font-heading">TU FAMILIA ELEGIDA, TU LUGAR SEGURO</p>
  </div>

  <!-- Stats -->
  <div class="stats-grid" id="stats"></div>

  <!-- Panel -->
  <div class="parchment-panel panel">
    <div style="position:relative;">
      <div class="panel-title-row">
        <span class="panel-flame">🔥</span>
        <h2 class="panel-title font-display">Cuadro de Asistencia</h2>

      <!-- Controls -->
      <div class="controls">

          </select>
          <span class="filter-arrow">▾</span>
        </div>
      </div>

      <!-- Vista de tabla (escritorio / tablet) -->
      <div class="table-wrap">
        <table class="att-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Participante</th>
              <th class="col-center">Asistencias</th>
              <th>Eventos</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- Vista de tarjetas (móvil) -->
      <div id="cardList" class="card-list"></div>

      <div id="emptyState" class="empty-state">
        No se encontraron participantes con esos filtros.
      </div>

      <!-- Pagination -->
      <div class="pagination-bar">
        <p id="resultsInfo" class="results-info"></p>
        <div id="pagination" class="pagination"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="divider-flame footer-divider"></div>
    <p class="footer-text font-display">Gracias por ser parte de esta comunidad</p>
    <p class="footer-heart">❤</p>
  </div>

</div>

// Formato "Nombre Propio": primera letra de cada palabra en mayúscula, resto minúscula
function toProperCase(str){
  return str.toLowerCase().split(' ').map(w => {
    if(!w) return w;
    return w.charAt(0).toLocaleUpperCase('es') + w.slice(1);
  }).join(' ');
}

// Formato para reporte (privacidad): solo el primer nombre completo + iniciales del resto
function shortenName(nombre){
  const words = nombre.split(' ').filter(Boolean);
  if(words.length <= 1) return words.join(' ');
  const iniciales = words.slice(1).map(w => w.charAt(0).toUpperCase() + '.').join(' ');
  return `${words[0]} ${iniciales}`;
}

const data = rawData.map(([dni, nombre, asistencias, eventos]) => {
  const nombreCompleto = toProperCase(nombre.trim().replace(/\s+/g,' '));
  return {
    dni,
    nombre: shortenName(nombreCompleto),
    asistencias,
    eventos
  };
});

// ---------- Estado ----------
let state = { search: '', event: '', page: 1, perPage: 10 };

// ---------- Poblar filtro de eventos ----------
const allEvents = Array.from(new Set(data.flatMap(d => d.eventos))).sort();
const eventFilter = document.getElementById('eventFilter');
allEvents.forEach(ev => {
  const opt = document.createElement('option');
  opt.value = ev; opt.textContent = ev;
  eventFilter.appendChild(opt);
});

// ---------- Stats ----------
function renderStats(){
  const total = data.length;
  const conAsistencia = data.filter(d => d.asistencias > 0).length;
  const sinAsistencia = total - conAsistencia;
  const totalAsistencias = data.reduce((a,d)=>a+d.asistencias,0);
  const stats = [
    { label: 'Participantes', value: total, icon: '🔥' },
    { label: 'Con Asistencia', value: conAsistencia, icon: '🔥' },
    { label: 'Sin Asistencia', value: sinAsistencia, icon: '🕯️' },
    { label: 'Total Asistencias', value: totalAsistencias, icon: '⚔️' },
  ];
  document.getElementById('stats').innerHTML = stats.map(s => `
    <div class="parchment-panel stat-card">
      <div class="stat-icon">${s.icon}</div>
      <div class="stat-value font-display">${s.value}</div>
      <div class="stat-label font-heading">${s.label}</div>
    </div>
  `).join('');
}

// ---------- Filtrado ----------
function getFiltered(){
  return data.filter(d => {
    const matchesSearch = d.nombre.toLowerCase().includes(state.search.toLowerCase());
    const matchesEvent = !state.event || d.eventos.includes(state.event);
    return matchesSearch && matchesEvent;
  });
}

function attendClass(n){
  if(n >= 3) return 'attend-3';
  if(n === 2) return 'attend-2';
  if(n === 1) return 'attend-1';
  return 'attend-0';
}

// ---------- Render tabla + tarjetas ----------
function render(){
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / state.perPage));
  if(state.page > totalPages) state.page = totalPages;
  const start = (state.page - 1) * state.perPage;
  const pageItems = filtered.slice(start, start + state.perPage);

  const tbody = document.getElementById('tableBody');
  const cardList = document.getElementById('cardList');
  const emptyState = document.getElementById('emptyState');

  if(pageItems.length === 0){
    tbody.innerHTML = '';
    cardList.innerHTML = '';
    emptyState.classList.add('visible');
  } else {
    emptyState.classList.remove('visible');

    tbody.innerHTML = pageItems.map((d, i) => `
      <tr>
        <td class="col-index">${start + i + 1}</td>
        <td class="col-name">${d.nombre}</td>
        <td class="col-attend">
          <span class="attend-pill ${attendClass(d.asistencias)}">${d.asistencias}</span>
        </td>
        <td>
          <div class="events-cell">
            ${ d.eventos.length
                ? d.eventos.map(ev => `<span class="badge-event">${ev}</span>`).join('')
                : `<span class="badge-none">Sin registro</span>`
            }
          </div>
        </td>
      </tr>
    `).join('');

    cardList.innerHTML = pageItems.map((d, i) => `
      <div class="p-card">
        <div class="p-card-top">
          <div class="p-card-name-wrap">
            <span class="p-card-index font-heading">${start + i + 1}</span>
            <span class="p-card-name">${d.nombre}</span>
          </div>
          <span class="attend-pill small ${attendClass(d.asistencias)}">${d.asistencias}</span>
        </div>
        <div class="p-card-badges">
          ${ d.eventos.length
              ? d.eventos.map(ev => `<span class="badge-event small">${ev}</span>`).join('')
              : `<span class="badge-none small">Sin registro</span>`
          }
        </div>
      </div>
    `).join('');
  }

  document.getElementById('resultsInfo').textContent =
    filtered.length === 0 ? '' : `Mostrando ${start+1}–${Math.min(start+state.perPage, filtered.length)} de ${filtered.length} participantes`;

  renderPagination(totalPages);
}

function renderPagination(totalPages){
  const el = document.getElementById('pagination');
  if(totalPages <= 1){ el.innerHTML=''; return; }
  let html = '';
  html += `<button class="page-btn" ${state.page===1?'disabled':''} data-page="${state.page-1}">‹</button>`;

  const pages = [];
  for(let p=1; p<=totalPages; p++){
    if(p===1 || p===totalPages || Math.abs(p-state.page)<=1) pages.push(p);
    else if(pages[pages.length-1] !== '...') pages.push('...');
  }
  pages.forEach(p => {
    if(p === '...'){
      html += `<span class="page-ellipsis">…</span>`;
    } else {
      html += `<button class="page-btn ${p===state.page?'active':''}" data-page="${p}">${p}</button>`;
    }
  });

  html += `<button class="page-btn" ${state.page===totalPages?'disabled':''} data-page="${state.page+1}">›</button>`;
  el.innerHTML = html;

  el.querySelectorAll('button[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.page = parseInt(btn.dataset.page);
      render();
      document.querySelector('.parchment-panel').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

// ---------- Eventos UI ----------
document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  state.page = 1;
  render();
});
document.getElementById('eventFilter').addEventListener('change', (e) => {
  state.event = e.target.value;
  state.page = 1;
  render();
});

// ---------- Embers de fondo ----------
function spawnEmbers(){
  const container = document.getElementById('embers');
  const count = window.innerWidth < 640 ? 14 : 26;
  for(let i=0;i<count;i++){
    const e = document.createElement('div');
    const size = 3 + Math.random()*6;
    e.className = 'ember';
    e.style.width = size+'px';
    e.style.height = size+'px';
    e.style.left = Math.random()*100+'vw';
    e.style.setProperty('--drift', (Math.random()*80-40)+'px');
    e.style.animationDuration = (6+Math.random()*8)+'s';
    e.style.animationDelay = (Math.random()*10)+'s';
    container.appendChild(e);
  }
}

renderStats();
render();
spawnEmbers();
